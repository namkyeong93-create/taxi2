}
function step(n){showSlide(current+n)}
function toggleOverlay(name){if(overlay===name)name='';overlay=name;const active=!!name;$('scrim').classList.toggle('show',active);$('drawer').classList.toggle('open',name==='menu');$('notes').classList.toggle('open',name==='notes');$('help').classList.toggle('show',name==='help');$('drawer').setAttribute('aria-hidden',String(name!=='menu'));$('notes').setAttribute('aria-hidden',String(name!=='notes'))}
SLIDES.forEach((s,i)=>{const b=document.createElement('button');b.className='thumb';b.type='button';b.setAttribute('aria-label',`${i+1}번 ${s.title} 열기`);const im=document.createElement('img');im.src=s.image;im.alt='';im.loading='lazy';const t=document.createElement('span');t.className='thumb-text';const sm=document.createElement('small');sm.textContent=`${String(i+1).padStart(2,'0')} · ${s.section}`;const tt=document.createElement('span');tt.textContent=s.title;t.append(sm,tt);b.append(im,t);b.onclick=()=>{showSlide(i);toggleOverlay('')};$('thumbList').append(b)});
$('prevBtn').onclick=$('clickPrev').onclick=()=>step(-1);$('nextBtn').onclick=$('clickNext').onclick=()=>step(1);
$('menuBtn').onclick=()=>toggleOverlay('menu');$('notesBtn').onclick=()=>toggleOverlay('notes');$('helpBtn').onclick=()=>toggleOverlay('help');$('closeMenu').onclick=$('closeNotes').onclick=$('closeHelp').onclick=$('scrim').onclick=()=>toggleOverlay('');
$('fullscreenBtn').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}else{await document.exitFullscreen()}}catch(e){console.warn('전체화면이 지원되지 않습니다.',e)}};
window.addEventListener('hashchange',()=>showSlide(hashIndex(),{fromHash:true}));
window.addEventListener('keydown',e=>{if(e.key==='Escape'){toggleOverlay('');return}if(overlay)return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();step(1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();step(-1)}else if(e.key==='Home'){e.preventDefault();showSlide(0)}else if(e.key==='End'){e.preventDefault();showSlide(SLIDES.length-1)}else if(e.key.toLowerCase()==='f'&&!e.altKey&&!e.ctrlKey){$('fullscreenBtn').click()}});
$('slideRegion').addEventListener('wheel',e=>{if(overlay||Math.abs(e.deltaY)<12)return;e.preventDefault();const now=Date.now();if(now-lastWheel<650)return;lastWheel=now;step(e.deltaY>0?1:-1)},{passive:false});
$('slideFrame').addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
$('slideFrame').addEventListener('touchend',e=>{if(!touchStart||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)step(dx<0?1:-1);touchStart=null},{passive:true});
showSlide(hashIndex(),{fromHash:true});
</script>
</body>
