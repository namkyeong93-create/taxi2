<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fc">
<title>하루 습관 체크 · 3가지</title>
<style>
:root{font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif;color:#20283b;background:#f7f8fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{width:min(740px,calc(100% - 32px));margin:0 auto;padding:54px 0 70px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;color:#6e68d9}h1{font-size:clamp(29px,5.5vw,43px);letter-spacing:-.06em;margin:10px 0 9px}.sub{color:#7a8498;margin:0;line-height:1.7;font-size:14px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.today-tag{background:#fff;border:1px solid #e9ebf2;padding:10px 13px;border-radius:15px;white-space:nowrap;font-size:12px;font-weight:800;color:#656c7e;box-shadow:0 5px 22px #21244b06}.main{margin-top:30px;display:grid;gap:18px}.panel{background:white;border:1px solid #edf0f6;border-radius:23px;box-shadow:0 12px 40px #1d285008;padding:25px}.sectionline{display:flex;align-items:center;justify-content:space-between;gap:10px}.small-label{font-size:12px;font-weight:850;color:#777e92}.score{display:flex;align-items:baseline;gap:5px;margin-top:12px}.score strong{font-size:51px;font-weight:850;letter-spacing:-.08em}.score span{color:#8790a0;font-size:17px;font-weight:700}.progress{height:11px;background:#eff0f7;border-radius:100px;overflow:hidden;margin-top:17px}.progress>div{width:0%;height:100%;background:linear-gradient(90deg,#7872f9,#a58afc);border-radius:inherit;transition:width .35s ease}.between{display:flex;justify-content:space-between;color:#8b93a3;font-size:12px;margin-top:11px}.datebar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:20px}.date-nav{display:flex;align-items:center;gap:8px}.navbtn{width:35px;height:35px;border-radius:12px;border:1px solid #e9ebf2;background:#fff;color:#677080;font-size:20px;cursor:pointer}.navbtn:hover{background:#f3f2ff}.date-title{font-size:16px;font-weight:800;letter-spacing:-.035em}.mini{border:0;border-radius:11px;background:#f2f1ff;color:#6861cb;padding:10px 12px;font-weight:800;cursor:pointer}.habit-list{display:grid;gap:12px}.habit{border:1px solid #e9ecf4;background:#fff;border-radius:18px;padding:17px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .2s,background .2s}.habit:has(.o.active){background:#fcfcff;border-color:#d9d6ff}.habit:has(.x.active){background:#fffcfc;border-color:#f5dddd}.habit-left{display:flex;align-items:center;gap:11px;min-width:0}.symbol{width:40px;height:40px;border-radius:13px;background:#f3f2ff;color:#786fe8;display:grid;place-items:center;font-size:19px;flex:none}.habit-name{border:1px solid transparent;border-radius:8px;color:#30384d;font:inherit;font-size:15px;font-weight:800;min-width:0;width:100%;max-width:300px;padding:6px 4px;background:transparent;text-overflow:ellipsis}.habit-name:hover,.habit-name:focus{border-color:#d8d4fa;background:white;outline:none}.habit-name:focus{box-shadow:0 0 0 3px #7771f51a}.hint{font-size:11px;color:#a0a5b3;margin:4px 0 0 4px}.choices{display:flex;gap:7px;flex:none}.choice{width:46px;height:43px;border:1px solid #e9ecf3;background:#f7f8fb;border-radius:12px;color:#8991a2;font-size:21px;font-weight:850;cursor:pointer;transition:all .18s}.choice:hover{transform:translateY(-1px);border-color:#bab4f1}.choice.o.active{background:#7772ef;border-color:#7772ef;color:white;box-shadow:0 5px 14px #7772ef35}.choice.x.active{background:#ef8b90;border-color:#ef8b90;color:white;box-shadow:0 5px 14px #ef8b9030}.bottom{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.note{font-size:12px;color:#9aa1b0}.reset{border:0;background:transparent;color:#8d94a3;font-size:12px;text-decoration:underline;cursor:pointer;padding:8px}.footer{text-align:center;color:#a5aab8;font-size:12px;margin-top:24px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);background:#262b40;color:white;padding:12px 19px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 35px #14182b28}.toast.show{opacity:1;transform:translate(-50%,0)}button:focus-visible{outline:3px solid #a7a2ff;outline-offset:2px}@media(max-width:540px){.wrap{padding-top:32px}.header{align-items:center}.today-tag{font-size:11px;padding:9px}.panel{padding:20px 17px;border-radius:20px}.habit{padding:13px 11px;gap:6px}.symbol{width:34px;height:34px;font-size:16px}.habit-left{gap:5px}.habit-name{font-size:13px;max-width:170px}.hint{font-size:10px}.choices{gap:5px}.choice{width:39px;height:40px}.date-title{font-size:14px}.note{max-width:200px;line-height:1.5}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body><main class="wrap"><header class="header"><div><div class="eyebrow">MY DAILY ROUTINE</div><h1>오늘도, 한 걸음 ✨</h1><p class="sub">하루 세 가지 작은 습관을 기록해 보세요.<br>꾸준함이 쌓이면 변화가 됩니다.</p></div><div class="today-tag" id="todayTag"></div></header><div class="main"><section class="panel" aria-label="달성 현황"><div class="sectionline"><span class="small-label">DAILY PROGRESS</span><span class="small-label" id="statusCaption">기록을 시작해 보세요</span></div><div class="score"><strong id="percent">0</strong><span>% 달성</span></div><div class="progress" role="progressbar" aria-label="달성률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar"><div id="progressFill"></div></div><div class="between"><span id="count">완료 0 / 3개</span><span id="pending">미체크 3개</span></div></section><section class="panel"><div class="datebar"><div class="date-nav"><button class="navbtn" id="prev" aria-label="전날">‹</button><span class="date-title" id="dateTitle"></span><button class="navbtn" id="next" aria-label="다음 날">›</button></div><button class="mini" id="goToday">오늘로 이동</button></div><div class="habit-list" id="habitList"></div><div class="bottom"><span class="note">습관 이름을 누르면 수정할 수 있어요.</span><button class="reset" id="reset">이 날짜 기록 초기화</button></div></section></div><div class="footer">기록은 이 브라우저에 자동 저장됩니다 · 나만의 습관 트래커</div></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';const KEY='daily-habit-tracker-3-v1';const DEFAULT=['물 2L 마시기','30분 운동하기','책 10분 읽기'];const icons=['💧','🏃','📚'];let state={names:[...DEFAULT],records:{}};try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.names)&&saved.names.length===3&&saved.records&&typeof saved.records==='object')state={names:saved.names.map((x,i)=>String(x||DEFAULT[i])),records:saved.records}}catch(e){}const $=id=>document.getElementById(id);const today=new Date();today.setHours(12,0,0,0);let selected=new Date(today);let toastTimer;const pad=n=>String(n).padStart(2,'0');const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const fmt=d=>`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){showToast('저장할 수 없습니다. 브라우저 저장 설정을 확인해 주세요.')}};function showToast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}function getRecord(){let a=state.records[dateKey(selected)];return Array.isArray(a)?[0,1,2].map(i=>a[i]==='o'||a[i]==='x'?a[i]:null):[null,null,null]}function render(){const record=getRecord(),done=record.filter(x=>x==='o').length,answered=record.filter(Boolean).length,pct=Math.round(done/3*100);$('dateTitle').textContent=fmt(selected);$('todayTag').textContent=`TODAY · ${today.getMonth()+1}.${today.getDate()}`;$('percent').textContent=pct;$('progressFill').style.width=pct+'%';$('progressBar').setAttribute('aria-valuenow',pct);$('count').textContent=`완료 ${done} / 3개`;$('pending').textContent=`미체크 ${3-answered}개`;$('statusCaption').textContent=done===3?'완벽한 하루! 🎉':answered===3?'오늘의 기록 완료':answered>0?'좋은 시작이에요!':'기록을 시작해 보세요';$('next').disabled=false;$('habitList').replaceChildren(...state.names.map((name,i)=>{const div=document.createElement('div');div.className='habit';const left=document.createElement('div');left.className='habit-left';const ico=document.createElement('span');ico.className='symbol';ico.textContent=icons[i];const text=document.createElement('div');text.style.minWidth='0';const inp=document.createElement('input');inp.className='habit-name';inp.value=name;inp.maxLength=40;inp.setAttribute('aria-label',`${i+1}번 습관 이름`);inp.title='클릭하여 이름 수정';inp.addEventListener('change',()=>{state.names[i]=inp.value.trim()||DEFAULT[i];inp.value=state.names[i];save();showToast('습관 이름을 저장했어요')});inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()});const hint=document.createElement('div');hint.className='hint';hint.textContent=`HABIT 0${i+1}`;text.append(inp,hint);left.append(ico,text);const group=document.createElement('div');group.className='choices';group.setAttribute('role','group');group.setAttribute('aria-label',`${state.names[i]} 달성 여부`);for(const [v,t,aria]of [['o','O','달성'],['x','X','미달성']]){let btn=document.createElement('button');btn.className=`choice ${v}${record[i]===v?' active':''}`;btn.type='button';btn.textContent=t;btn.setAttribute('aria-label',`${state.names[i]} ${aria}`);btn.setAttribute('aria-pressed',String(record[i]===v));btn.addEventListener('click',()=>{const next=getRecord();next[i]=next[i]===v?null:v;state.records[dateKey(selected)]=next;save();render();if(next.every(x=>x==='o'))showToast('🎉 세 가지 습관을 모두 달성했어요!')});group.append(btn)}div.append(left,group);return div}))}function move(n){selected.setDate(selected.getDate()+n);render()}$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('goToday').addEventListener('click',()=>{selected=new Date(today);render()});$('reset').addEventListener('click',()=>{if(!getRecord().some(Boolean))return showToast('초기화할 기록이 없어요');if(confirm('이 날짜의 O/X 기록을 모두 초기화할까요?')){delete state.records[dateKey(selected)];save();render();showToast('기록을 초기화했어요')}});render()})();
</script></body></html>
